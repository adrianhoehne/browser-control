[package]
name = "browser-control-bridge"
version = "0.1.0"
edition = "2021"
publish = false

# Stage 4a of docs/38 installs exactly this binary name; keep it stable.
[[bin]]
name = "browser-control-bridge"
path = "src/main.rs"

# The modules are a library as well, so the integration tests under `tests/` can
# measure them in-process — exactly as `test/*.test.js` measured `bridge/*.mjs`.
# `main.rs` stays the thin start path on top of it.
[lib]
name = "browser_control_bridge"
path = "src/lib.rs"

[dependencies]
# `docs/38`, `## Dependency changes` names these features; nothing is added here
# without a line in that table. 2a uses `rt-multi-thread`/`macros` for the async
# entry point, `net` for the listener and `signal` for the shutdown contract; the
# rest arrive with the stages that need them (2c `sync`/`time`, 2d `io-util`/
# `io-std`, 2f `process`) and are declared once so the lock file stops churning.
tokio = { version = "1", features = [
  "rt-multi-thread",
  "net",
  "time",
  "signal",
  "sync",
  "io-util",
  "io-std",
  "process",
  "macros",
] }
# 2b: `Sec-WebSocket-Accept` is Base64 of SHA-1(key + GUID). Both crates are named
# in `docs/38`, `## Dependency changes`; nothing else comes with the WebSocket
# module, because the frame codec is ours.
sha1 = "0.10"
base64 = "0.22"
# 2c: the token compare is `sha256(expected)` against `sha256(candidate)` and then
# a constant-time compare of the two digests` — `==` on `[u8]` bails out at the
# first differing byte, which is the regression step `subtle` exists to prevent.
sha2 = "0.10"
subtle = "2"
# 2c: the hub is a JSON protocol layer (it parses `hello`, builds the frames and
# projects results for the debug block), so the `Value` type arrives with it and
# not with the tool layer of 2d. `preserve_order` is decided, not inherited: the
# unlisted fields of a debug block are appended in *result* order, and a key-sorted
# map would print them alphabetically instead.
serde_json = { version = "1", features = ["preserve_order"] }
# 2d: the tool layer's JSON-RPC error object is a struct that serialises itself, so the
# wire names cannot drift away from the fields. `derive` is the only feature here.
# `serde` is the same crate `serde_json` is built on — the lock file does not grow.
serde = { version = "1", features = ["derive"] }
# 2e: `POST /mcp` is the one surface a library earns its keep on — chunked request
# bodies, `Content-Length`, keep-alive and `Connection: close` are HTTP/1.1 details that
# nobody should re-derive by hand. The extension port keeps its own head reader
# (`head.rs`), because there the bytes behind the handshake belong to the frame codec.
hyper = { version = "1", features = ["server", "http1"] }
# `tokio` only: it is what supplies `TokioTimer`, and with it the header deadline hyper
# silently drops without a timer. `server` here would only enable `hyper_util::server`
# (the auto-connection builder), which nothing in this tree uses — `hyper/server` is
# already switched on by the line above.
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

# 3: Windows has no `/proc`, so the two questions Linux answers by reading it need the
# operating system's own API — who holds the port (`GetExtendedTcpTable`) and what
# descriptor 0 is (`GetFileType`), plus the process name behind that PID
# (`OpenProcess`/`QueryFullProcessImageNameW`). `docs/38`, `## Dependency changes` names
# exactly these four features; `Win32_System_Console` is deliberately absent, because
# `GetStdHandle` is not needed — `std::io::Stdin::as_raw_handle` already hands over the
# inherited handle. The crate is a `cfg(windows)` dependency, so the Linux build does not
# see it at all; it is already in `Cargo.lock` as one of tokio's transitive crates.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_NetworkManagement_IpHelper",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_Foundation",
] }
